# Network configuration of the dnx RTOS POSIX simulator (netmgr).
#
# Host TAP interface configuration example (Linux):
#   sudo ip tuntap add tap0 mode tap user $USER
#   sudo ip addr add 192.168.77.1/24 dev tap0
#   sudo ip link set tap0 up
#   build/dnx-sim --disk 0=build/sim-romfs.bin:ro --tap tap0

[interface]
path = /dev/eth
hwaddr = 02:00:00:D7:00:02
autonegotiation = enable
speed = 100M
duplex = full

[IP]
mode = static
address = 192.168.77.2
netmask = 255.255.255.0
gateway = 192.168.77.1

# Additional networks: sections [interface:<name>] and [IP:<name>] (keys as
# above), network <name> is configured when its interface file exists. W5500
# Ethernet controller of the test board (sim-env/boards/test.lua, Ethernet
# segment "lan2", device /dev/eth-w5500 created by sim-env/tests/inet2.lua):
[interface:inet1]
path = /dev/eth-w5500
hwaddr = 02:00:00:00:78:02
autonegotiation = enable
speed = 100M
duplex = full

[IP:inet1]
mode = static
address = 192.168.78.2
netmask = 255.255.255.0
gateway = 0.0.0.0
